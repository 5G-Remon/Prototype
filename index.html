<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #00ffcc; margin-bottom: 5px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .version-card {
            background-color: #2a2a2a;
            padding: 15px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #3a3a3a;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .version-card:hover {
            border-color: #00ffcc;
            background-color: #333333;
            transform: translateY(-2px);
        }
        .tag {
            font-size: 0.8rem;
            background-color: #00ffcc;
            color: #1a1a1a;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Select Game Version</h1>
    <p>Choose a build version from the history below to play:</p>

    <div class="version-list">
        <a href="./v0.0.1/" class="version-card">
            <span>v1.1.0</span>
            <span class="tag" style="background-color: #ffcc00;">Beta</span>
        </a>
        
        <a href="./v0.0.0/" class="version-card">
            <span>v1.0.0</span>
            <span class="tag">Stable</span>
        </a>
    </div>

</body>
</html>
